plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.android'
}

// Release values come from Gradle properties (-PtextbeeApiBaseUrl=…), so the
// fork's release workflow sets them without editing this file. An empty
// optional link hides the button or row that would open it.
def prop = { String name, String fallback -> (project.findProperty(name) ?: fallback).toString() }
def apiBaseUrl = prop('textbeeApiBaseUrl', 'https://textbee-api.joowdx.dev/api/v1/').replaceAll('/+$', '') + '/'
def links = [
        WEB_BASE_URL : prop('textbeeWebBaseUrl', 'https://textbee.joowdx.dev').replaceAll('/+$', ''),
        RELEASES_REPO: prop('textbeeReleasesRepo', 'joowdx/textbee'),
        SUPPORT_URL  : prop('textbeeSupportUrl', ''),
        COMMUNITY_URL: prop('textbeeCommunityUrl', ''),
        DOCS_URL     : prop('textbeeDocsUrl', ''),
        PRICING_URL  : prop('textbeePricingUrl', ''),
        TERMS_URL    : prop('textbeeTermsUrl', ''),
        PRIVACY_URL  : prop('textbeePrivacyUrl', ''),
]

android {
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode prop('textbeeVersionCode', '20').toInteger()
        versionName prop('textbeeVersionName', '2.9.0')

        links.each { name, value -> buildConfigField "String", name, "\"${value}\"" }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

//        javaCompileOptions {
//            annotationProcessorOptions {
//                arguments["room.schemaLocation"] = "$projectDir/schemas"
//            }
//        }
    }
    signingConfigs {
        debug {
            storeFile file("${System.getenv("HOME")}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // TODO: Change to release signing config
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    flavorDimensions "environment"
    
    productFlavors {
        dev {
            dimension "environment"
            applicationId prop('textbeeApplicationId', 'com.vernu.sms') + '.dev'
            versionNameSuffix "-dev"
            buildConfigField "String", "API_BASE_URL", "\"${prop('textbeeDevApiBaseUrl', apiBaseUrl)}\""
            buildConfigField "String", "ENVIRONMENT", '"development"'
            resValue "string", "app_name", "textbeeqtt (Dev)"
        }
        
        prod {
            dimension "environment"
            applicationId prop('textbeeApplicationId', 'com.vernu.sms')
            buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
            buildConfigField "String", "ENVIRONMENT", '"production"'
            resValue "string", "app_name", "textbeeqtt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.4.8'
    }

    // Netty, under the MQTT client, ships the same metadata files in each jar
    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation platform('com.google.firebase:firebase-bom:29.2.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-messaging-directboot'
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // Declared rather than taken transitively from Retrofit: the app builds its
    // own client to name itself in outgoing requests.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    
    // MQTT 5 over WebSockets: the live link to the server, with push as the fallback
    implementation 'com.hivemq:hivemq-mqtt-client:1.3.17'
    implementation platform('com.hivemq:hivemq-mqtt-client-websocket:1.3.17')

    implementation 'androidx.work:work-runtime:2.7.1'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Compose integration
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'androidx.navigation:navigation-compose:2.7.2'

    // Coroutines + Lifecycle
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'

//    def room_version = "2.4.2"
//    implementation "androidx.room:room-runtime:$room_version"
//    annotationProcessor "androidx.room:room-compiler:$room_version"
}

