# textbee MQTT broker. See README.md for first-time setup.

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Plain MQTT for the API, reachable only inside the Docker network
listener 1883
protocol mqtt

# WebSockets for devices. The reverse proxy and tunnel terminate TLS and
# forward to this port; it is not published on the host.
listener 9001
protocol websockets

# Clients and ACLs live in the dynamic-security file, managed live by the API
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
