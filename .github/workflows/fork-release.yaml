# Builds this fork's release from its own code: the API and web images
# (amd64, to ghcr.io/<owner>/<repo>/{api,web}) and the prod APK, then
# publishes a GitHub release tagged <upstream tag>-fork.<n>.
#
# The fork carries its own commits on top of an upstream release, so it runs
# on demand: rebase onto a new upstream release, then dispatch. The upstream
# tag is the app's versionName (2.9.0 -> v2.9.0) and n counts this fork's
# releases of it. The APK's versionName is the release tag and its
# versionCode is upstream's times 100 plus n, so every fork build is newer
# than the last and the app's update check can compare them. Build-time
# values:
#   - web/.env carries the NEXT_PUBLIC_* values Next.js inlines into the bundle;
#   - Gradle properties set the APK's API URL, package name, version and links;
#   - the APK has this fork's Firebase project and signing key.
#
# Repository variables:
#   API_BASE_URL                    e.g. https://sms.example.com/api/v1
#   ANDROID_APPLICATION_ID          the APK's package name, e.g. com.example.sms
#   SITE_URL                        e.g. https://sms-dashboard.example.com
#   NEXT_PUBLIC_TURNSTILE_SITE_KEY  optional
#   NEXT_PUBLIC_GOOGLE_CLIENT_ID    optional
#   APP_SUPPORT_URL, APP_COMMUNITY_URL, APP_DOCS_URL, APP_PRICING_URL, APP_TERMS_URL,
#   APP_PRIVACY_URL                 optional links in the app and dashboard; empty hides them
#   APP_REFUND_URL, APP_STATUS_URL, APP_SUPPORT_EMAIL, APP_SECURITY_EMAIL,
#   APP_SMS_PERMISSION_GUIDE_URL    optional, dashboard only
# Repository secrets:
#   GOOGLE_SERVICES_JSON            google-services.json of the Firebase Android app
#                                   registered for ANDROID_APPLICATION_ID
#   ANDROID_KEYSTORE_BASE64         base64 of the release keystore
#   ANDROID_KEY_ALIAS               the key's alias in it
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
name: Fork release

on:
    workflow_dispatch:

permissions:
    contents: write
    packages: write

concurrency:
    group: fork-release
    cancel-in-progress: false

env:
    UPSTREAM: vernu/textbee

jobs:
    plan:
        name: Plan the version
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            upstream_tag: ${{ steps.plan.outputs.upstream_tag }}
            version: ${{ steps.plan.outputs.version }}
            version_code: ${{ steps.plan.outputs.version_code }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Plan
              id: plan
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gradle=android/app/build.gradle
                  name=$(sed -nE "s/.*prop\('textbeeVersionName', '([^']+)'\).*/\1/p" "$gradle")
                  code=$(sed -nE "s/.*prop\('textbeeVersionCode', '([0-9]+)'\).*/\1/p" "$gradle")
                  test -n "$name" && test -n "$code" || { echo "::error::No default versionName/versionCode in $gradle"; exit 1; }

                  upstream_tag="v$name"
                  released=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
                      | grep -c "^${upstream_tag}-fork\.[0-9]*$" || true)
                  n=$((released + 1))
                  test "$n" -le 99 || { echo "::error::$upstream_tag has 99 fork releases; versionCode would collide"; exit 1; }

                  {
                      echo "upstream_tag=$upstream_tag"
                      echo "version=${upstream_tag}-fork.$n"
                      echo "version_code=$((code * 100 + n))"
                  } >> "$GITHUB_OUTPUT"
                  echo "Upstream $upstream_tag, fork release $n (versionCode $((code * 100 + n)))" >> "$GITHUB_STEP_SUMMARY"

    images:
        name: Build and push images
        needs: plan
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # Next.js inlines NEXT_PUBLIC_* at build time; the web Dockerfile
            # copies the whole folder, so web/.env reaches the build.
            - name: Write web/.env
              env:
                  API_BASE_URL: ${{ vars.API_BASE_URL }}
                  SITE_URL: ${{ vars.SITE_URL }}
                  TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
                  GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
                  NEXT_PUBLIC_DOCS_URL: ${{ vars.APP_DOCS_URL }}
                  NEXT_PUBLIC_COMMUNITY_URL: ${{ vars.APP_COMMUNITY_URL }}
                  NEXT_PUBLIC_PRICING_URL: ${{ vars.APP_PRICING_URL }}
                  NEXT_PUBLIC_TERMS_URL: ${{ vars.APP_TERMS_URL }}
                  NEXT_PUBLIC_PRIVACY_URL: ${{ vars.APP_PRIVACY_URL }}
                  NEXT_PUBLIC_REFUND_URL: ${{ vars.APP_REFUND_URL }}
                  NEXT_PUBLIC_STATUS_URL: ${{ vars.APP_STATUS_URL }}
                  NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.APP_SUPPORT_EMAIL }}
                  NEXT_PUBLIC_SECURITY_EMAIL: ${{ vars.APP_SECURITY_EMAIL }}
                  NEXT_PUBLIC_SMS_PERMISSION_GUIDE_URL: ${{ vars.APP_SMS_PERMISSION_GUIDE_URL }}
              run: |
                  test -n "$API_BASE_URL" || { echo "::error::Set the API_BASE_URL repository variable"; exit 1; }
                  test -n "$SITE_URL" || { echo "::error::Set the SITE_URL repository variable"; exit 1; }
                  {
                      echo "NEXT_PUBLIC_API_BASE_URL=${API_BASE_URL%/}"
                      echo "NEXT_PUBLIC_SITE_URL=${SITE_URL%/}"
                      if [ -n "$TURNSTILE_SITE_KEY" ]; then echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY"; fi
                      if [ -n "$GOOGLE_CLIENT_ID" ]; then echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"; fi
                      echo "NEXT_PUBLIC_RELEASES_REPO=$GITHUB_REPOSITORY"
                      for name in DOCS_URL COMMUNITY_URL PRICING_URL TERMS_URL PRIVACY_URL REFUND_URL \
                          STATUS_URL SUPPORT_EMAIL SECURITY_EMAIL SMS_PERMISSION_GUIDE_URL; do
                          var="NEXT_PUBLIC_$name"
                          if [ -n "${!var}" ]; then echo "$var=${!var}"; fi
                      done
                  } > web/.env

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to ghcr.io
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - name: Build and push API
              uses: docker/build-push-action@v6
              with:
                  context: api
                  platforms: linux/amd64
                  push: true
                  build-args: VERSION=${{ needs.plan.outputs.version }}
                  tags: |
                      ${{ env.IMAGE }}/api:${{ needs.plan.outputs.version }}
                      ${{ env.IMAGE }}/api:latest

            - name: Build and push web
              uses: docker/build-push-action@v6
              with:
                  context: web
                  platforms: linux/amd64
                  push: true
                  build-args: VERSION=${{ needs.plan.outputs.version }}
                  tags: |
                      ${{ env.IMAGE }}/web:${{ needs.plan.outputs.version }}
                      ${{ env.IMAGE }}/web:latest

    release:
        name: Build APK and release
        needs: [plan, images]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  java-version: '17'
                  distribution: 'temurin'

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Add the Firebase config
              env:
                  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
              run: |
                  test -n "$GOOGLE_SERVICES_JSON" || { echo "::error::Set the GOOGLE_SERVICES_JSON secret"; exit 1; }
                  printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/src/prod/google-services.json

            # Upstream signs release builds with ~/.android/debug.keystore. A
            # throwaway one lets Gradle build; the APK is re-signed below.
            - name: Build the prod APK
              working-directory: android
              env:
                  API_BASE_URL: ${{ vars.API_BASE_URL }}
                  APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
                  SITE_URL: ${{ vars.SITE_URL }}
                  SUPPORT_URL: ${{ vars.APP_SUPPORT_URL }}
                  COMMUNITY_URL: ${{ vars.APP_COMMUNITY_URL }}
                  DOCS_URL: ${{ vars.APP_DOCS_URL }}
                  PRICING_URL: ${{ vars.APP_PRICING_URL }}
                  TERMS_URL: ${{ vars.APP_TERMS_URL }}
                  PRIVACY_URL: ${{ vars.APP_PRIVACY_URL }}
                  VERSION: ${{ needs.plan.outputs.version }}
                  VERSION_CODE: ${{ needs.plan.outputs.version_code }}
              run: |
                  for name in API_BASE_URL APPLICATION_ID SITE_URL; do
                      test -n "${!name}" || { echo "::error::Set the $name repository variable"; exit 1; }
                  done
                  mkdir -p ~/.android
                  keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
                      -keypass android -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Throwaway"
                  chmod +x gradlew
                  ./gradlew assembleProdRelease \
                      -PtextbeeApiBaseUrl="$API_BASE_URL" \
                      -PtextbeeApplicationId="$APPLICATION_ID" \
                      -PtextbeeWebBaseUrl="$SITE_URL" \
                      -PtextbeeReleasesRepo="$GITHUB_REPOSITORY" \
                      -PtextbeeSupportUrl="$SUPPORT_URL" \
                      -PtextbeeCommunityUrl="$COMMUNITY_URL" \
                      -PtextbeeDocsUrl="$DOCS_URL" \
                      -PtextbeePricingUrl="$PRICING_URL" \
                      -PtextbeeTermsUrl="$TERMS_URL" \
                      -PtextbeePrivacyUrl="$PRIVACY_URL" \
                      -PtextbeeVersionName="${VERSION#v}" \
                      -PtextbeeVersionCode="$VERSION_CODE"

            - name: Sign with the release key
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                  VERSION: ${{ needs.plan.outputs.version }}
              run: |
                  for name in KEYSTORE_BASE64 KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
                      test -n "${!name}" || { echo "::error::Set the ANDROID_$name secret"; exit 1; }
                  done

                  keystore="$RUNNER_TEMP/release.jks"
                  printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
                  apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
                  apk="$RUNNER_TEMP/textbee-$VERSION.apk"

                  "$apksigner" sign \
                      --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
                      --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
                      --out "$apk" android/app/build/outputs/apk/prod/release/app-prod-release.apk
                  "$apksigner" verify --print-certs "$apk" | grep 'SHA-256' >> "$GITHUB_STEP_SUMMARY"
                  rm -f "$keystore"

            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.plan.outputs.version }}
                  UPSTREAM_TAG: ${{ needs.plan.outputs.upstream_tag }}
              run: |
                  image="ghcr.io/${GITHUB_REPOSITORY,,}"
                  gh release create "$VERSION" "$RUNNER_TEMP/textbee-$VERSION.apk" \
                      -R "$GITHUB_REPOSITORY" \
                      --target "$GITHUB_SHA" \
                      --title "$VERSION" \
                      --notes "This fork's code, on top of [$UPSTREAM $UPSTREAM_TAG](https://github.com/$UPSTREAM/releases/tag/$UPSTREAM_TAG).

                  Images:
                  - \`$image/api:$VERSION\`
                  - \`$image/web:$VERSION\`"
